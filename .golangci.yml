# golangci-lint configuration (v2 schema; requires golangci-lint >= v2.6 for
# modernize, CI pins v2.15.0). Lint jobs run `golangci-lint run` from each
# module directory and pick this up from the repo root.
#
# The linters enforce the mechanical rules of the Unified Go Style Standard
# (Effective Go, Google, Uber, CockroachDB, Kubernetes). Every rule has one
# owner so a violation is reported once. AST rules linters cannot express live
# in .github/scripts/sdkcheck and .github/scripts/otelcheck;
# design judgment rules live in AGENTS.md.
#
# CI lints every module on the full tree (`golangci-lint run ./...`) except the
# modules in LAX_MODULES (.github/workflows/ci.yml), which report only new issues;
# locally, run `golangci-lint run ./...` in a module, or
# `golangci-lint run --new-from-merge-base=main ./...` in a lax module.

version: "2"

formatters:
  enable:
    - gofmt
    - goimports # Standard library imports grouped first.
  settings:
    gofmt:
      simplify: true # gofmt -s

linters:
  default: none
  enable:
    # 1. Correctness & Modern Idioms
    - errcheck
    - errchkjson
    - govet # copylocks, testinggoroutine, composites
    - ineffassign
    - nilerr
    - nilnesserr
    - staticcheck # ST1003 MixedCaps/initialisms, ST1005 error strings, ST1006/ST1016 receivers, ST1012 ErrFoo
    - unconvert
    - unused
    - modernize # Official Go 1.22–1.26 idioms (incl. rangeint, any, reflecttypefor)
    - exptostd
    - usestdlibvars

    # 2. Naming, Structure & Declarations
    - revive # rule list below
    - gocritic # enabled-checks below
    - errname # ErrFoo sentinels, FooError types
    - embeddedstructfieldcheck
    - funcorder # constructors after type, exported methods before unexported
    - iotamixing
    - forcetypeassert
    - nakedret
    - recvcheck # all pointer or all value receivers per type
    - musttag
    - goprintffuncname
    - godoclint
    - godot

    # 3. Interfaces, API Shape & Context
    - iface # duplicate interface declarations
    - ireturn # accept interfaces, return concrete types (SDK contracts allowlisted)
    - containedctx # no context.Context fields in structs
    - contextcheck # propagate inherited ctx down call chains
    - fatcontext # nested contexts in loops/closures
    - noctx # HTTP/net calls with ctx in production code

    # 4. Mutation, Concurrency & Resources
    - reassign # prevent reassignment of package-level variables
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - durationcheck

    # 5. Hot-Path Performance
    - perfsprint # format replacements (errorf disabled for Go 1.26+)
    - prealloc
    - mirror

    # 6. Tests & Security
    - thelper
    - usetesting
    - depguard # stdlib testing + cmp.Diff over assertion frameworks
    - forbidigo # reflect.DeepEqual, flags outside main, root ctx, fmt.Print* in libs
    - gosec # G115 integer overflow, G404 crypto/rand vs math/rand
    - nolintlint # suppressions must name a specific linter and explain why

  settings:
    staticcheck:
      # QF* quick fixes are not style rules. ST1020-ST1022 duplicate revive's
      # exported rule, which also owns the stutter check.
      checks: ["all", "-QF*", "-ST1020", "-ST1021", "-ST1022"]

    funcorder:
      constructor: true
      struct-method: true
      function: false
      alphabetical: false

    revive:
      rules:
        - name: package-naming
        - name: exported
          arguments: ["sayRepetitiveInsteadOfStutters"]
        - name: unexported-return
        - name: var-naming
        - name: receiver-naming
        - name: time-naming
        - name: import-shadowing
        - name: redefines-builtin-id
        - name: import-alias-naming
          arguments: ["^[a-z][a-z0-9]*$"]
        - name: redundant-import-alias
        - name: blank-imports
        - name: dot-imports
        - name: error-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: early-return
          arguments: ["preserve-scope"]
        - name: empty-block
        - name: deep-exit
        - name: context-as-argument
          arguments: [{ allow-types-before: "*testing.T" }]
        - name: context-keys-type
        - name: enforce-slice-style
          arguments: ["nil"]
        - name: confusing-results
        - name: modifies-value-receiver
        - name: waitgroup-by-value
        - name: get-return
        - name: string-format
          arguments:
            - ["fmt.Errorf[0]", "!/(?i)(failed to|unable to|could not|couldn't|error occurred)/", "drop stop words; name the action that failed (\"load config: %w\")"]
            - ["fmt.Errorf[0]", "!/^.+%w.+$/", "place %w at the end (\"op: %w\"), or first for sentinel categorization"]
            - ["t.Errorf[0],t.Fatalf[0],t.Error[0],t.Fatal[0]", "!/(?i)\\b(expected|actual)\\b/", "use got/want wording: \"Func(%v) = %v, want %v\""]
            - ["t.Run[0]", "!/\\//", "subtest names must not contain '/'"]

    gocritic:
      disable-all: true
      enabled-checks:
        - appendAssign
        - boolExprSimplify
        - captLocal
        - defaultCaseOrder
        - deferInLoop
        - emptyStringTest
        - exitAfterDefer
        - ifElseChain
        - newDeref
        - nilValReturn
        - ptrToRefParam
        - sloppyLen
        - sprintfQuotedString
        - unnecessaryBlock
        - unslice

    nakedret:
      max-func-lines: 10

    iface:
      enable: [identical]

    ireturn:
      allow: [anon, error, empty, stdlib, generic, go.opentelemetry.io/otel/, github.com/fikrimohammad/go-servicekit/]

    perfsprint:
      errorf: false # Go 1.26 eliminated the allocation penalty on unformatted fmt.Errorf.

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    godoclint:
      default: basic
      disable:
        - start-with-name

    godot:
      scope: declarations

    depguard:
      rules:
        tests:
          files: ["$test"]
          deny:
            - pkg: github.com/stretchr/testify
              desc: use package testing with plain comparisons or cmp.Diff
            - pkg: github.com/smartystreets/goconvey
              desc: use package testing with t.Run subtests
            - pkg: github.com/onsi/gomega
              desc: use package testing with cmp.Diff
            - pkg: gotest.tools
              desc: use package testing with cmp.Diff

    forbidigo:
      forbid:
        - pattern: ^reflect\.DeepEqual$
          msg: compare with cmp.Diff/cmp.Equal, ==, slices.Equal, or maps.Equal
        - pattern: ^flag\.(Bool|BoolVar|BoolFunc|Duration|DurationVar|Float64|Float64Var|Func|Int|Int64|Int64Var|IntVar|String|StringVar|TextVar|Uint|Uint64|Uint64Var|UintVar|Var)$
          msg: define flags only in package main
        - pattern: ^context\.(Background|TODO)$
          msg: take ctx from caller; detach with context.WithoutCancel
        - pattern: ^fmt\.Print(f|ln)?$
          msg: use structured logging (slog/otel) in libraries; fmt.Print* only in cmd/main

    gosec:
      includes:
        - G115
        - G404

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - errchkjson
          - forcetypeassert
          - noctx
          - prealloc
      - path-except: _test\.go
        linters: [forbidigo]
        text: reflect\.DeepEqual
      - path: (^|/)(cmd/|main\.go$)|_test\.go
        linters: [forbidigo]
        text: flag\.|context\.(Background|TODO)|fmt\.Print

run:
  # revive's string-format rule races across concurrent package workers on cold
  # runs, sporadically skipping findings and tripping nolintlint unused checks
  # in multi-package modules (e.g. rest).
  concurrency: 1

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

# Deliberately NOT enabled:
#   decorder          fights logical grouping of constants/types and interface checks next to structs
#   gochecknoglobals  flags immutable OTel metrics.Instrument, reflect.TypeFor, and driver specs; reassign guards mutations
#   gochecknoinits    some SDK packages intentionally use init() to register safe defaults
#   interfacebloat    interface size reflects domain/mockable SDK surfaces, not an arbitrary cap
#   errorlint         conflicts with %w + %v boundary hiding and exact-identity error assertions
#   testableexamples  SDK examples against live infra intentionally omit // Output:
#   intrange          overlaps modernize (rangeint) while ignoring bound-evaluation side effects
#   asasalint         unmaintained upstream (no updates since May 2023)
#   lll               no fixed line length
#   varnamelen        short names are idiomatic in small scopes
#   exhaustruct_v5    omit zero-value struct fields
#   wrapcheck         don't wrap without adding context
#   err113            errors.New vs fmt.Errorf is free on Go 1.26+
#   nonamedreturns    named results are sometimes right (e.g. deferred err cleanup)
#   mnd               constants need a role, not an arbitrary magic-number ban
#   testpackage       same-package tests are fine when testing unexported behavior
#   testifylint, ginkgolinter: assertion libraries are not used
#   wsl_v5, nlreturn, whitespace: formatting beyond gofmt -s is out of scope
