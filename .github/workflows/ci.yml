name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  GOLANGCI_VERSION: v2.15.0
  # Every module is strict (full-tree golangci-lint, sdkcheck, and otelcheck)
  # unless it is listed here. The list may only shrink: remove a module in the
  # commit that makes it clean. Never add one without the owner's approval.
  LAX_MODULES: '[]'

jobs:
  modules:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.discover.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: |
          modules=$(find . -maxdepth 2 -name go.mod -not -path './vendor/*' -printf '%h\n' \
            | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  sdkcheck:
    name: sdkcheck & otelcheck self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test sdkcheck
        run: cd .github/scripts/sdkcheck && GOWORK=off go test -count=1 sdkcheck.go sdkcheck_test.go

      - name: Test otelcheck
        run: cd .github/scripts/otelcheck && GOWORK=off go test -count=1 otelcheck.go otelcheck_test.go

  doc-contracts:
    name: doc contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Test the contract check
        run: bash .github/scripts/check-doc-contracts_test.sh

      - name: Check doc contracts
        run: ./.github/scripts/check-doc-contracts.sh

  test:
    name: ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          # Downloading the release binary from GitHub intermittently returns
          # HTTP 504. goinstall builds it through the Go module proxy instead.
          install-mode: goinstall
          working-directory: ${{ matrix.module }}
          # Modules in LAX_MODULES fail only on new issues; all others are linted on
          # the full tree. See LAX_MODULES above.
          only-new-issues: ${{ contains(fromJSON(env.LAX_MODULES), matrix.module) }}
          # The restored lint cache served stale results: on an unchanged commit it
          # reported two nolintlint findings that an uncached run doesn't. A full
          # uncached run of a module takes seconds, so results stay deterministic.
          skip-cache: true

      - name: Custom Go & OTel checks
        if: ${{ !contains(fromJSON(env.LAX_MODULES), matrix.module) }}
        run: |
          GOWORK=off go run ../.github/scripts/sdkcheck/sdkcheck.go ./...
          GOWORK=off go run ../.github/scripts/otelcheck/otelcheck.go ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -shuffle=on ./...

      - name: Test with race detector
        run: go test -count=1 -race -shuffle=on ./...

      - name: Tidy check
        run: go mod tidy -diff

  etcd-integration:
    name: etcd integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The upstream etcd image is distroless, so Docker's shell-form
      # healthcheck cannot run; the step below polls the HTTP health endpoint.
      etcd:
        image: gcr.io/etcd-development/etcd:v3.7.1
        env:
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
        ports:
          - 2379:2379
    env:
      CONF_ETCD_ENDPOINT: 127.0.0.1:2379
    defaults:
      run:
        working-directory: conf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: conf/go.sum

      - name: Wait for etcd
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2379/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::etcd did not become ready"
          exit 1

      - name: Run etcd integration tests
        run: |
          set -o pipefail
          go test -count=1 -race -timeout 5m -run '^TestEtcdIntegration' -v ./... \
            | tee "$RUNNER_TEMP/etcd-integration.log"

      - name: Assert integration tests passed, not skipped
        run: |
          if [ ! -s "$RUNNER_TEMP/etcd-integration.log" ]; then
            echo "::error::integration test log is missing or empty"
            exit 1
          fi
          if grep -qE '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/etcd-integration.log"; then
            echo "::error::an integration test or subtest was skipped"
            exit 1
          fi
          # TestEtcdIntegration runs in conf and internal/providers/etcd.
          count=$(grep -cE '^--- PASS: TestEtcdIntegration \(' "$RUNNER_TEMP/etcd-integration.log" || true)
          count=${count:-0}
          if [ "$count" -lt 2 ]; then
            echo "::error::expected TestEtcdIntegration in 2 packages, found ${count}; it may have been skipped or removed"
            exit 1
          fi
          for test in TestEtcdIntegrationCompaction TestEtcdIntegrationCloseStopsWatch; do
            if ! grep -qE "^--- PASS: ${test} \(" "$RUNNER_TEMP/etcd-integration.log"; then
              echo "::error::${test} did not pass; it may have been skipped"
              exit 1
            fi
          done

  db-integration:
    name: db integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: report_db
          MYSQL_USER: app
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: report_db
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d report_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_MYSQL_DSN: 'app:secret@tcp(127.0.0.1:3306)/report_db'
      DB_POSTGRES_DSN: 'postgres://app:secret@127.0.0.1:5432/report_db?sslmode=disable'
    defaults:
      run:
        working-directory: db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: db/go.sum

      - name: Run MySQL and PostgreSQL integration tests
        run: |
          set -o pipefail
          go test -count=1 -run '^(TestMySQLIntegration|TestPostgresIntegration)$' -v ./... \
            | tee "$RUNNER_TEMP/db-integration.log"

      - name: Assert integration tests passed, not skipped
        run: |
          if grep -qE '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/db-integration.log"; then
            echo "::error::an integration test or subtest was skipped"
            exit 1
          fi
          for test in TestMySQLIntegration TestPostgresIntegration; do
            if ! grep -qE "^--- PASS: ${test} \(" "$RUNNER_TEMP/db-integration.log"; then
              echo "::error::${test} did not pass; it may have been skipped"
              exit 1
            fi
          done

  release-dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test release script
        run: bash .github/scripts/release_test.sh

      - name: Check sibling requires match VERSION
        run: .github/scripts/release.sh "$(tr -d '[:space:]' < VERSION)" --check

      # The full dry run also checks that VERSION is not yet tagged or in the
      # proxy, so it runs only until VERSION is released. After a release,
      # bump VERSION (and every sibling require) before the next one.
      - name: Dry-run release of VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if git ls-remote --exit-code --tags origin "refs/tags/*/$version" >/dev/null; then
            echo "VERSION $version is already released; bump it before the next release."
          else
            .github/scripts/release.sh "$version" --dry-run
          fi
